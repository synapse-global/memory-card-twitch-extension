<!doctype html>
<html lang="en">
  <head>
    <script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memory Game</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap");

      :root,
      html,
      body {
        color: oklch(51.5% 0.206 15.868);
        font-size: 1.5vw;
        font-family: "Press Start 2P", sans-serif;
      }
      body {
        min-height: 100svh;
        margin: 0;
      }
      .main {
        min-height: 100svh;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
      }
      .title {
        margin: 0;
        margin-bottom: 3rem;
        font-size: 4rem;
        font-weight: bold;
        text-align: center;
        text-transform: uppercase;
        border-radius: 1.5rem;
      }
      .link {
        font-size: 1.5rem;
        color: oklch(51.5% 0.206 15.868);
        text-decoration: underline;
      }
      .link:hover {
        color: oklch(0.444 0.177 26.899);
      }
      .paragraph {
        color: rgb(77, 75, 75);
        line-height: 1.5;
        max-width: 40rem;
        text-align: center;
      }
    </style>
  </head>
  <body style="min-height: 100svh; margin: 0">
    <section class="main">
      <h1 class="title">Memory_Match</h1>
      <a
        href="https://config.memorymatch.info/"
        target="_blank"
        class="link"
        title="You’ll be forwarded to config.memorymatch.info"
        >Configure the extension</a
      >
      <p class="paragraph">You’ll be forwarded to config.memorymatch.info</p>
    </section>
  </body>
</html>
