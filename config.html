<!DOCTYPE html>
<html lang="en">
    <head>
        <script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Memory Game</title>
        <style>
            :root,
            html,
            body {
                font-size: 1.5vw;
                font-family: Lato, sans-serif;
            }
            body {
                min-height: 100svh;
                margin: 0;
                background: #1d1e1f;
            }
            .main {
                min-height: 100svh;
                width: 100%;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
            }
            .title {
                margin: 0;
                margin-bottom: 1rem;
                font-family: 'Giorgio';
                font-size: 5rem;
                font-weight: bold;
                text-align: center;
                color: white;
                text-transform: uppercase;
                border-radius: 1.5rem;
            }
            .subtitle {
                max-width: 40rem;
                margin: 0;
                margin-bottom: 2rem;
                font-size: 1.5rem;
                text-align: center;
                text-wrap: balance;
                line-height: 1.2;
                color: white;
            }
        </style>
    </head>
    <body
        style="min-height: 100svh; margin: 0;"
    >
        <section class="main">
          <h1 class="title">Memory Game</h1>
          <p class="subtitle">
            Go and Play!
          </p>
        </section>
    </body>
</html>
